<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Descrição da página para mecanismos de busca (SEO) -->
    <meta
        name="description"
        content="Faça seu cadastro como voluntário na ONG Solidária. Preencha seus dados com segurança e junte-se à nossa rede de transformação social."
    >

    <title>Cadastro de Voluntários | ONG Solidária</title>

    <!-- Arquivos de Estilo e Comportamento -->
    <link rel="stylesheet" href="css/cadastro.css">
    <script src="js/script.js" defer></script>
</head>

<body>

    <!-- Cabeçalho Principal do Site -->
    <header>
        <!-- Logotipo da ONG Otimizado -->
        <figure>
            <a
                href="index.html"
                aria-label="Ir para a página inicial da ONG Solidária"
            >
                <picture>
                    <source srcset="img/logo-ong.avif" type="image/avif">
                    <source srcset="img/logo-ong.webp" type="image/webp">
                    <img
                        src="img/logo-ong.png"
                        alt="Logotipo da ONG Solidária, composto por mãos estilizadas em formato de abraço"
                        width="150"
                        height="50"
                    >
                </picture>
            </a>
        </figure>

        <!-- Menu de Navegação Principal -->
        <nav aria-label="Navegação principal">
            <ul>
                <li>
                    <a href="index.html">Início</a>
                </li>

                <li>
                    <a href="projetos.html">Projetos</a>
                </li>

                <li>
                    <!-- Indica que esta é a página atual -->
                    <a
                        href="cadastro.html"
                        aria-current="page"
                    >
                        Seja Voluntário
                    </a>
                </li>
            </ul>
        </nav>
    </header>

    <!-- Conteúdo Principal da Página -->
    <main>
        <section
            id="secao-cadastro"
            aria-labelledby="titulo-cadastro"
        >
            <header>
                <h1 id="titulo-cadastro">
                    Junte-se à Nossa Rede de Voluntários
                </h1>

                <p>
                    Preencha o formulário abaixo com seus dados para iniciar
                    sua jornada de impacto social conosco de forma segura.
                </p>
            </header>

            <!-- Formulário de Cadastro de Voluntário -->
            <form
                action="#"
                method="post"
                id="form-voluntario"
            >

                <!-- Bloco 1: Dados Pessoais -->
                <fieldset>
                    <legend>Dados pessoais</legend>

                    <p>
                        <label for="nome">
                            Nome completo:
                        </label>

                        <input
                            type="text"
                            id="nome"
                            name="nome"
                            autocomplete="name"
                            placeholder="Digite seu nome completo"
                            required
                        >
                    </p>

                    <p>
                        <label for="email">
                            E-mail:
                        </label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            autocomplete="email"
                            placeholder="seu.email@exemplo.com"
                            required
                        >
                    </p>

                    <p>
                        <label for="telefone">
                            Telefone / WhatsApp:
                        </label>

                        <input
                            type="tel"
                            id="telefone"
                            name="telefone"
                            autocomplete="tel"
                            inputmode="tel"
                            placeholder="(00) 00000-0000"
                            pattern="\(\d{2}\)\s\d{5}-\d{4}"
                            title="Digite o telefone no formato: (00) 00000-0000"
                            required
                        >
                    </p>

                    <p>
                        <label for="cpf">
                            CPF:
                        </label>

                        <input
                            type="text"
                            id="cpf"
                            name="cpf"
                            inputmode="numeric"
                            autocomplete="off"
                            placeholder="000.000.000-00"
                            pattern="\d{3}\.\d{3}\.\d{3}-\d{2}"
                            title="Digite o CPF no formato: 000.000.000-00"
                            required
                        >
                    </p>
                </fieldset>

                <!-- Bloco 2: Endereço -->
                <fieldset>
                    <legend>Endereço</legend>

                    <p>
                        <label for="cep">
                            CEP:
                        </label>

                        <input
                            type="text"
                            id="cep"
                            name="cep"
                            autocomplete="postal-code"
                            inputmode="numeric"
                            placeholder="00000-000"
                            pattern="\d{5}-\d{3}"
                            title="Digite o CEP no formato: 00000-000"
                            required
                        >
                    </p>

                    <p>
                        <label for="rua">
                            Logradouro:
                        </label>

                        <input
                            type="text"
                            id="rua"
                            name="rua"
                            autocomplete="street-address"
                            placeholder="Rua, Avenida, etc."
                            required
                        >
                    </p>

                    <p>
                        <label for="numero">
                            Número:
                        </label>

                        <input
                            type="text"
                            id="numero"
                            name="numero"
                            autocomplete="address-line2"
                            inputmode="numeric"
                            placeholder="Ex.: 123"
                            required
                        >
                    </p>

                    <p>
                        <label for="bairro">
                            Bairro:
                        </label>

                        <input
                            type="text"
                            id="bairro"
                            name="bairro"
                            autocomplete="address-level3"
                            placeholder="Nome do bairro"
                            required
                        >
                    </p>
                </fieldset>

                <!-- Bloco 3: Preferências de Atuação -->
                <fieldset>
                    <legend>Preferências de atuação</legend>

                    <p>
                        <label for="area-atuacao">
                            Área de interesse:
                        </label>

                        <select
                            id="area-atuacao"
                            name="area_atuacao"
                            required
                        >
                            <option value="" selected disabled>
                                Selecione uma área
                            </option>

                            <option value="educacao">
                                Educação e Mentoria
                            </option>

                            <option value="logistica">
                                Logística e Arrecadação
                            </option>

                            <option value="comunicacao">
                                Comunicação e Apoio
                            </option>
                        </select>
                    </p>

                    <p>
                        <label for="disponibilidade">
                            Disponibilidade semanal:
                        </label>

                        <select
                            id="disponibilidade"
                            name="disponibilidade"
                            required
                        >
                            <option value="" selected disabled>
                                Selecione o período
                            </option>

                            <option value="manha">
                                Manhã
                            </option>

                            <option value="tarde">
                                Tarde
                            </option>

                            <option value="integral">
                                Integral
                            </option>

                            <option value="flexivel">
                                Flexível / Finais de semana
                            </option>
                        </select>
                    </p>
                </fieldset>

                <!-- Botão de Envio do Formulário -->
                <div class="acoes-formulario">
                    <button
                        type="submit"
                        class="btn-cta"
                    >
                        Enviar cadastro
                    </button>
                </div>

            </form>
        </section>
    </main>

    <!-- Rodapé do Site -->
    <footer>
        <p>
            &copy; 2026 ONG Solidária. Todos os direitos reservados.
        </p>
    </footer>

</body>
</html>
